[bootstrap.macos.finder]
show_pathbar = true
show_status_bar = true
preferred_view_style = "list"

[bootstrap.macos.dock]
autohide = true
mru_spaces = false

[bootstrap.macos.trackpad]
tap_to_click = true
three_finger_drag = true

[bootstrap.macos.defaults]
"com.apple.finder" = { _FXSortFoldersFirst = true }
"com.apple.dock" = { "appswitcher-all-displays" = true, "expose-group-apps" = true, showhidden = true, showMissionControlGestureEnabled = true, showAppExposeGestureEnabled = true }
".GlobalPreferences" = { "com.apple.mouse.scaling" = 2.0 }
NSGlobalDomain = { AppleKeyboardUIMode = 2, AppleShowAllExtensions = true, InitialKeyRepeat = 15, KeyRepeat = 1, "com.apple.sound.beep.feedback" = 1 }
"com.apple.AppleMultitouchTrackpad" = { TrackpadRightClick = true }
"com.apple.driver.AppleBluetoothMultitouch.trackpad" = { TrackpadRightClick = true }
"com.apple.universalaccess" = { closeViewScrollWheelToggle = true, mouseDriverCursorSize = 2.0 }

[bootstrap.user]
login_shell = "/bin/zsh"
