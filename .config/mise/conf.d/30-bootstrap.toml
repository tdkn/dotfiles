[bootstrap.macos.finder]
show_pathbar = true
show_status_bar = true
preferred_view_style = "list"

[bootstrap.macos.dock]
autohide = true
mru_spaces = false

[bootstrap.macos.trackpad]
tap_to_click = true
three_finger_drag = true

[bootstrap.macos.defaults]
".GlobalPreferences"."com.apple.mouse.scaling" = 2.0
"com.apple.AppleMultitouchTrackpad".TrackpadRightClick = true
"com.apple.dock"."appswitcher-all-displays" = true
"com.apple.dock"."expose-group-apps" = true
"com.apple.dock".showAppExposeGestureEnabled = true
"com.apple.dock".showMissionControlGestureEnabled = true
"com.apple.dock".showhidden = true
"com.apple.driver.AppleBluetoothMultitouch.trackpad".TrackpadRightClick = true
"com.apple.finder"._FXSortFoldersFirst = true
"com.apple.universalaccess".closeViewScrollWheelToggle = true
"com.apple.universalaccess".mouseDriverCursorSize = 2.0
NSGlobalDomain."com.apple.sound.beep.feedback" = 1
NSGlobalDomain.AppleKeyboardUIMode = 2
NSGlobalDomain.AppleShowAllExtensions = true
NSGlobalDomain.InitialKeyRepeat = 15
NSGlobalDomain.KeyRepeat = 1

[bootstrap.user]
login_shell = "/bin/zsh"
