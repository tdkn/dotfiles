[tasks.bootstrap]
depends = [{ task = "packages", optional = true }]
run = [
  "apm install -g --frozen",
  # GitButler ships its skill with the CLI and can update between bootstrap runs.
  """
if command -v but >/dev/null 2>&1; then
  but skill check --global --update
else
  echo "but not found; skipping the GitButler skill check" >&2
fi
""",
]

[tasks.skills-update]
description = "Update apm-managed skills and save the lockfile to dotfiles"
# apm asks for confirmation before applying the update plan.
interactive = true
run = ["apm update -g", "apm install -g", "mise dot add ~/.apm/apm.lock.yaml"]
