name: tdkn-agents
version: 0.1.0
description: Third-party agent skills installed at user scope.

# Pinned so install never auto-detects and writes outside these two roots.
# agent-skills -> ~/.agents/skills (read by Codex CLI); claude -> ~/.claude/skills.
targets:
  - agent-skills
  - claude

dependencies:
  apm:
    - anthropics/skills/skills/frontend-design#main
    - ast-grep/agent-skill/ast-grep/skills/ast-grep#main
    - github/awesome-copilot/skills/create-agentsmd#main
    - humanlayer/skills/plugins/show-me/skills/show-me#main
    - mattpocock/skills/skills/productivity/grill-me#main
    - mattpocock/skills/skills/productivity/grilling#main
    - mountain-loop/yaak/crates-cli/yaak-cli/skills/use-yaak#main
    - shadcn/improve/skills/improve#main
    - cursor/plugins/thermos#main
    - cursor/plugins/pstack/skills/unslop#main
    - android/skills/devtools/android-cli#main
    - android/skills/jetpack-compose/adaptive#main
    - android/skills/jetpack-compose/migration/migrate-xml-views-to-jetpack-compose#main
    - android/skills/navigation/navigation-3#main
    - android/skills/performance/r8-analyzer#main
    - android/skills/play/play-policy-insights#main
    - android/skills/profilers/android-profiler#main
    - android/skills/security/android-intent-security#main
    - android/skills/system/edge-to-edge#main
    - android/skills/testing/testing-setup#main
    - kepano/obsidian-skills/skills/defuddle#main
    - kepano/obsidian-skills/skills/json-canvas#main
    - kepano/obsidian-skills/skills/obsidian-bases#main
    - kepano/obsidian-skills/skills/obsidian-cli#main
    - kepano/obsidian-skills/skills/obsidian-markdown#main
