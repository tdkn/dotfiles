name: tdkn-agents
version: 0.1.0
description: Third-party agent skills installed at user scope.

# Pinned so install never auto-detects and writes outside these two roots.
# agent-skills -> ~/.agents/skills (read by Codex CLI); claude -> ~/.claude/skills.
targets:
  - agent-skills
  - claude

dependencies:
  apm:
    - anthropics/skills/skills/frontend-design
    - ast-grep/agent-skill/ast-grep/skills/ast-grep
    - github/awesome-copilot/skills/create-agentsmd
    - openai/codex/.codex/skills/babysit-pr
    - shadcn/improve/skills/improve
    - cursor/plugins/thermos
    - android/skills/devtools/android-cli
    - android/skills/jetpack-compose/adaptive
    - android/skills/jetpack-compose/migration/migrate-xml-views-to-jetpack-compose
    - android/skills/navigation/navigation-3
    - android/skills/performance/r8-analyzer
    - android/skills/play/play-policy-insights
    - android/skills/profilers/android-profiler
    - android/skills/security/android-intent-security
    - android/skills/system/edge-to-edge
    - android/skills/testing/testing-setup
